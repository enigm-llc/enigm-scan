# SonarQube Cloud automatic analysis.
sonar.sources=src,src-tauri/src,agent/core/src,agent/runtime/src,scripts,worker
sonar.exclusions=vendor/**,intelligence/sources/**,dist/**,**/target/**,src-tauri/gen/**,**/*.test.ts,**/*.test.tsx,scripts/engines/test_*.py,scripts/engines/ios_fixture.py
