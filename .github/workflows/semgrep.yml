name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "29 5 * * 2"

permissions:
  contents: read

jobs:
  scan:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      SEMGREP_SEND_METRICS: "off"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install 'semgrep==1.172.0'
      - name: Scan source
        run: |
          if test -n "$SEMGREP_APP_TOKEN"; then
            semgrep ci --no-suppress-errors --metrics=off --exclude vendor --exclude intelligence/sources
          elif test -n "$BASE_SHA"; then
            semgrep scan --config p/default --baseline-commit "$BASE_SHA" --error --metrics=off --exclude vendor --exclude intelligence/sources
          else
            echo 'Semgrep App token is unavailable for this event.' >&2
            exit 1
          fi
