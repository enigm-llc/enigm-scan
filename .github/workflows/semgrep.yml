name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "29 5 * * 2"

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      # Installed from hashes (.github/tools/semgrep.txt); the token is only
      # given to the step that scans.
      - run: python -m pip install --require-hashes --no-deps -r .github/tools/semgrep.txt
      - name: Scan source
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_SEND_METRICS: "off"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if test -n "$SEMGREP_APP_TOKEN"; then
            semgrep ci --no-suppress-errors --metrics=off --exclude vendor --exclude intelligence/sources
          elif test -n "$BASE_SHA"; then
            semgrep scan --config p/default --baseline-commit "$BASE_SHA" --error --metrics=off --exclude vendor --exclude intelligence/sources
          else
            echo 'Semgrep App token is unavailable for this event.' >&2
            exit 1
          fi
