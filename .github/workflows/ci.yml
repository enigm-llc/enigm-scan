name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web
    # Interface, website and download server: tests, types, build, advisories.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm test
      - run: npm run build

  rust:
    name: rust
    # The scanning core, its runtime and the desktop shell: format, lints
    # with warnings as errors, tests and RustSec advisories.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            src-tauri/target
            agent/core/target
            agent/runtime/target
          key: ci-rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-rust-${{ runner.os }}-
      - name: Desktop shell build dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: rustup component add rustfmt clippy
      # The desktop shell embeds the built interface.
      - run: npm ci
      - run: npm run build
      - name: Format
        run: |
          cargo fmt --manifest-path agent/core/Cargo.toml --check
          cargo fmt --manifest-path agent/runtime/Cargo.toml --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lints
        run: |
          cargo clippy --manifest-path agent/core/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path agent/runtime/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Tests
        run: |
          cargo test --manifest-path agent/core/Cargo.toml --locked
          cargo test --manifest-path agent/runtime/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: RustSec advisories
        run: |
          cargo audit --version 2>/dev/null | grep -qx 'cargo-audit 0.23.0' || cargo install cargo-audit --locked --version 0.23.0
          cargo audit --file agent/core/Cargo.lock
          cargo audit --file agent/runtime/Cargo.lock
          cargo audit --file src-tauri/Cargo.lock

  engines:
    name: engines
    # The Python adapters around MVT and the iOS USB transport, installed
    # from the same hash-locked files as the shipped engines.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r scripts/engines/engines.lock
      - run: python -m pip install --require-hashes --no-deps -r scripts/engines/pymobiledevice3.lock
      - run: python scripts/engines/test_ios_entry.py
      - run: python scripts/engines/test_mvt_entry.py
      # The auditor gets its own environment, installed from hashes, so it
      # cannot change what the engines' tests ran with.
      - name: Python advisories
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --require-hashes --no-deps -r .github/tools/pip-audit.txt
          "$RUNNER_TEMP/audit/bin/pip-audit" --strict --disable-pip --no-deps -r scripts/engines/engines.lock
          "$RUNNER_TEMP/audit/bin/pip-audit" --strict --disable-pip --no-deps -r scripts/engines/pymobiledevice3.lock
