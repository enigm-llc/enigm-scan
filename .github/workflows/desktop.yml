name: Build desktop app
# Four platform builds, started by hand when a release is prepared.
on:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize the Mac packages (needs the release-macos environment)
        type: boolean
        default: true
      sign_windows:
        description: Sign the Windows package with Artifact Signing (needs the release-windows environment)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  # A started build always finishes: cancelling wastes the time already spent.
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: appimage
          - os: windows-latest
            bundles: none
          - os: macos-latest
            bundles: app
          - os: macos-15-intel
            bundles: app
    runs-on: ${{ matrix.os }}
    # The Mac jobs of a release use the protected environment that holds the
    # Developer ID certificate and the notary key; it waits for approval.
    # The Windows job of a signed release uses its own protected environment:
    # Azure accepts its sign-in (OpenID Connect, no stored password) only
    # from that environment.
    environment: ${{ inputs.sign_macos && startsWith(matrix.os, 'macos') && 'release-macos' || inputs.sign_windows && startsWith(matrix.os, 'windows') && 'release-windows' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      ENIGM_MACOS_IDENTITY: "${{ inputs.sign_macos && startsWith(matrix.os, 'macos') && 'Developer ID Application: Enigm, LLC (CRRU2PL879)' || '' }}"
      ENIGM_WINDOWS_SIGNING: ${{ inputs.sign_windows && startsWith(matrix.os, 'windows') && 'true' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      # A signed build always compiles from scratch: nothing a previous run
      # left in the cache ends up inside a package signed for release.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: env.ENIGM_MACOS_IDENTITY == '' && env.ENIGM_WINDOWS_SIGNING == ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            agent/core/target
            agent/runtime/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}-
            rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        # The Azure HTTP mirror stalled at ~40 KiB/s. Keep Ubuntu signatures
        # and use the official HTTPS archive on this ephemeral runner.
        run: |
          sudo python3 - <<'PYAPT'
          from pathlib import Path
          import re
          sources = [*Path('/etc/apt').glob('*mirrors*.txt'), Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]
          for source in sources:
              if source.is_file():
                  original = source.read_text()
                  updated = re.sub(r'https?://azure\.archive\.ubuntu\.com/ubuntu', 'https://archive.ubuntu.com/ubuntu', original)
                  source.write_text(updated)
                  if original != updated:
                      print('Updated Ubuntu archive in', source.name)
          PYAPT
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libfuse2t64 patchelf xvfb
      - run: npm ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Use official backward-compatible Python on Intel macOS
        if: matrix.os == 'macos-15-intel'
        run: python scripts/engines/setup-macos-python.py
      # Every packaged Python distribution is version- and hash-locked, so a
      # newly published dependency release cannot enter the shipped engines.
      - name: Install hash-locked forensic engine, packager and adapter dependencies
        run: python -m pip install --require-hashes --no-deps -r scripts/engines/engines.lock
      - name: Install hash-locked USB-only iOS adapter
        run: python -m pip install --require-hashes --no-deps -r scripts/engines/pymobiledevice3.lock
      - name: Test and package iOS USB transport
        run: |
          python scripts/engines/test_ios_entry.py
          python scripts/engines/build-ios.py
      - name: Test pinned MVT coverage adapter
        run: python scripts/engines/test_mvt_entry.py
      - name: Package verified USB transport
        run: python scripts/engines/build-adb.py
      - name: Package offline engine with licenses and inventory
        run: python scripts/engines/build-mvt.py
      # A temporary keychain that exists only for this job. The certificate
      # file is deleted once imported; the keychain is deleted at the end.
      - name: Prepare the Developer ID certificate and notary key
        if: env.ENIGM_MACOS_IDENTITY != ''
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain" | grep -F "$ENIGM_MACOS_IDENTITY"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
      - name: Sign the engines
        if: env.ENIGM_MACOS_IDENTITY != ''
        run: python scripts/engines/sign-macos-engines.py
      - name: Sign in to Azure
        if: env.ENIGM_WINDOWS_SIGNING != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Signing changes the engines' bytes, so it comes before the app is
      # built: the catalog the app compiles in describes the signed files.
      - name: Sign the engines (Windows)
        if: env.ENIGM_WINDOWS_SIGNING != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\resources\engines
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Record the signed engines in the catalog
        if: env.ENIGM_WINDOWS_SIGNING != ''
        run: python scripts/engines/refresh_catalog.py
      - run: npm test
      - run: cargo test --manifest-path agent/core/Cargo.toml --locked
      - run: cargo test --manifest-path agent/runtime/Cargo.toml --locked
      - name: Verify packaged ADB lifecycle without USB access
        run: cargo test --manifest-path agent/runtime/Cargo.toml --locked -- --ignored
      # The restored cache can hold an earlier copy of the bundled resources in
      # a different layout (an engine that was a file is now a folder); Tauri
      # cannot copy over it. The engines themselves are rebuilt above.
      - name: Drop cached copies of bundled resources
        shell: bash
        run: rm -rf src-tauri/target/release/resources src-tauri/target/release/bundle
      - name: Build native application
        if: runner.os != 'Windows'
        run: npm exec tauri -- build --bundles ${{ matrix.bundles }}
      - name: Build portable Windows executable without installer
        if: runner.os == 'Windows'
        run: npm exec tauri -- build --no-bundle
      - name: Sign the app (Windows)
        if: env.ENIGM_WINDOWS_SIGNING != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\src-tauri\target\release\enigm-scan.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Check the Windows signatures
        if: env.ENIGM_WINDOWS_SIGNING != ''
        shell: pwsh
        run: |
          $files = @(Get-Item src-tauri/target/release/enigm-scan.exe) +
            @(Get-ChildItem src-tauri/resources/engines -Recurse -Include *.exe,*.dll,*.pyd)
          $bad = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { $bad.FullName; throw 'Unsigned or invalid files' }
          "$($files.Count) files signed"
      - name: Verify macOS architecture and deployment floor
        if: runner.os == 'macOS'
        run: python scripts/engines/check-macos.py
      - name: Package portable application
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python scripts/engines/package-portable.py
      - name: Verify optimized Linux variant iterator regression
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --test glib_regression
      - name: Keep portable candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-candidate-${{ matrix.os }}
          path: |
            src-tauri/target/release/portable/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove the signing keychain and notary key
        if: always() && env.ENIGM_MACOS_IDENTITY != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"
