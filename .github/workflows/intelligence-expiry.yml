name: Intelligence expiry
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      # The copy embedded in the next app build, and the public copies apps download.
      - run: node scripts/check-intelligence-expiry.mjs --days=14
      - run: node scripts/check-intelligence-expiry.mjs --days=14 --file=src-tauri/resources/intelligence/bundle-v2.json
      - run: node scripts/check-intelligence-expiry.mjs --days=14 --url=https://scan.enigm.io/downloads/intelligence.json
      - run: node scripts/check-intelligence-expiry.mjs --days=14 --url=https://scan.enigm.io/downloads/intelligence-v2.json
