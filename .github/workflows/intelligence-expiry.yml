name: Intelligence expiry
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # The copy embedded in the next app build, and the public copies apps download.
      - run: node scripts/check-intelligence-expiry.mjs --days=14
      - run: node scripts/check-intelligence-expiry.mjs --days=14 --file=src-tauri/resources/intelligence/bundle-v2.json
      - run: node scripts/check-intelligence-expiry.mjs --days=14 --url=https://scan.enigm.io/downloads/intelligence.json
      - run: node scripts/check-intelligence-expiry.mjs --days=14 --url=https://scan.enigm.io/downloads/intelligence-v2.json
      # Mondays, or when run by hand: what changed upstream in the sources,
      # to review before the next signed release. It changes nothing.
      - name: Sources to review
        env:
          EVENT: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [ "$(date -u +%u)" = 1 ] || [ "$EVENT" = workflow_dispatch ] || exit 0
          set -o pipefail
          node scripts/intel/check-sources.mjs | tee -a "$GITHUB_STEP_SUMMARY"
