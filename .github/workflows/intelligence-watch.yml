name: Intelligence watch
# Every morning: what changed upstream in the indicator sources, and the
# indicators the research worker found in new public research (each quoted
# from the article). Posted to one issue for a maintainer to review; it never
# changes or signs the indicators.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: intelligence-watch
  cancel-in-progress: false
jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/intel/review.mjs | tee -a "$GITHUB_STEP_SUMMARY"
