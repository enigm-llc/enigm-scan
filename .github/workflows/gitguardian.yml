name: GitGuardian

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitguardian
    # Forks and Dependabot get no repository secrets; the GitGuardian app
    # still checks those pull requests.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
      GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
      GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install 'ggshield==1.52.2'
      - name: Scan commits for secrets
        run: |
          test -n "$GITGUARDIAN_API_KEY" || { echo 'GitGuardian API key is not configured.' >&2; exit 1; }
          ggshield secret scan ci --no-check-for-updates
