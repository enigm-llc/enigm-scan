version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week, so a compromised version is caught first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directories: [/agent/core, /agent/runtime, /src-tauri]
    schedule:
      interval: weekly
    # New releases wait a week, so a compromised version is caught first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
