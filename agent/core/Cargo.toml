[package]
name = "enigm-scan-core"
version = "1.0.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Enigm Scan analysis: signed indicators, evidence parsing and behaviour rules."
repository = "https://github.com/enigm-llc/enigm-scan"
publish = false

[dependencies]
base64 = "0.23"
cap-std = "4"
fs2 = "0.4.3"
ed25519-dalek = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"
idna = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
