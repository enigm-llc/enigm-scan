[package]
name = "enigm-scan-runtime"
version = "0.7.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Enigm Scan native runtime: verified engines, phone acquisition and private temporary folders."
repository = "https://github.com/enigm-llc/enigm-scan"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
enigm-scan-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.22"
tempfile = "3"
walkdir = "2"
fs2 = "0.4.3"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Threading"] }
