[package]
name = "enigm-scan"
version = "1.0.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Enigm Scan desktop app: checks an iPhone or Android phone for spyware, locally."
repository = "https://github.com/enigm-llc/enigm-scan"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
enigm-scan-core = { path = "../agent/core" }
enigm-scan-runtime = { path = "../agent/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Native dialogs on Windows and macOS. Linux uses GTK directly (src/main.rs).
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
gtk = "0.18"

[patch.crates-io]
glib = { path = "../vendor/glib" }

# Development builds (`tauri dev`) are used for physical-device tests: optimize
# dependencies and the scan engine so hashing and parsing run at real speed.
[profile.dev.package."*"]
opt-level = 3
